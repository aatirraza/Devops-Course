name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:  # Level 0
  test:  # Level 1 (2 spaces in)
    runs-on: ubuntu-latest  # Level 2 (4 spaces in)
    steps:  # Level 2 (4 spaces in)
      - name: Checkout repository  # Level 3 (6 spaces in)
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
